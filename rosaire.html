<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Saint Rosaire | Aimez-Vous</title>
<meta name="description" content="Prier le Saint Rosaire pas à pas : les mystères du jour, les prières et la méditation de chaque dizaine.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --nuit:#14223F; --manteau:#2C4A86; --cierge:#E9B949;
    --page:#F7F8FB; --encre:#1B2232; --doux:#5A6378; --trait:#DCE1EC;
    --display:"Marcellus", Georgia, "Times New Roman", serif;
    --texte:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--encre);font-family:var(--texte);font-size:18px;line-height:1.5}
  a{color:inherit}
  button{font:inherit}
  :focus-visible{outline:3px solid var(--cierge);outline-offset:3px;border-radius:4px}

  .haut{background:var(--nuit);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px}
  .haut-int{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .marque{font-family:var(--display);font-size:1.5rem;text-decoration:none}
  .retour{color:#DDE3F0;text-decoration:none;font-size:1rem}
  .retour:hover{color:var(--cierge);text-decoration:underline}

  .titre-page{background:var(--nuit);color:#fff;text-align:center;padding:18px 20px 34px}
  .titre-page h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,7vw,3.6rem);margin:0;line-height:1.05}
  .titre-page p{margin:10px auto 0;color:#C6CEE0;max-width:46ch}

  main{max-width:900px;margin:0 auto;padding:24px 20px 48px}

  /* ---------- Choix des mystères ---------- */
  .choix{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .choix button{
    border:1px solid #CBD2E1;background:#fff;color:var(--encre);border-radius:10px;
    padding:10px 8px;cursor:pointer;text-align:center;line-height:1.25;
  }
  .choix button strong{display:block;font-family:var(--display);font-weight:400;font-size:1.1rem}
  .choix button span{font-size:.88rem;color:var(--doux)}
  .choix button[aria-pressed="true"]{background:var(--manteau);border-color:var(--manteau);color:#fff}
  .choix button[aria-pressed="true"] span{color:#DDE3F0}
  .aujourdhui{font-size:.95rem;color:var(--doux);margin:10px 2px 0}

  /* ---------- Le chapelet ---------- */
  .chapelet{
    margin:26px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:5px 4px;
    padding:14px;background:#fff;border:1px solid var(--trait);border-radius:12px;
  }
  .grain{
    width:13px;height:13px;border-radius:50%;border:2px solid #AEB8CE;background:#fff;padding:0;cursor:pointer;flex:none;
  }
  .grain.gros{width:20px;height:20px;border-color:var(--manteau)}
  .grain.croix,.grain.medaille{
    width:22px;height:22px;border:none;background:none;color:var(--manteau);font-size:1.1rem;line-height:22px;text-align:center;border-radius:4px;
  }
  .grain.fait{background:var(--manteau);border-color:var(--manteau)}
  .grain.croix.fait,.grain.medaille.fait{background:none;color:var(--manteau)}
  .grain.ici{background:var(--cierge);border-color:#B88A1E;transform:scale(1.25)}
  .grain.croix.ici,.grain.medaille.ici{background:none;color:#B88A1E;transform:scale(1.35)}
  .sep{width:6px;flex:none}

  /* ---------- L'étape en cours ---------- */
  .etape{
    margin-top:18px;background:#fff;border:1px solid var(--trait);border-top:5px solid var(--manteau);
    border-radius:12px;padding:24px clamp(18px,4vw,36px) 26px;min-height:300px;
  }
  .ou{color:var(--manteau);font-size:1rem;margin:0}
  .etape h2{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,4.5vw,2.2rem);color:var(--nuit);margin:4px 0 14px;line-height:1.15}
  .priere{font-family:var(--display);font-size:clamp(1.1rem,2.6vw,1.3rem);line-height:1.7;max-width:58ch;white-space:pre-line}
  .verset{
    font-family:var(--display);font-size:clamp(1.15rem,2.8vw,1.4rem);line-height:1.5;color:var(--nuit);
    border-left:4px solid var(--cierge);padding:4px 0 4px 16px;margin:0 0 14px;max-width:52ch;
  }
  .verset cite{display:block;font-family:var(--texte);font-style:normal;font-size:.95rem;color:var(--doux);margin-top:6px}
  .fruit{margin:0;color:var(--doux)}
  .fruit strong{color:var(--encre);font-weight:500}
  .compte{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
  .compte i{width:14px;height:14px;border-radius:50%;border:2px solid #AEB8CE}
  .compte i.fait{background:var(--manteau);border-color:var(--manteau)}
  .compte i.ici{background:var(--cierge);border-color:#B88A1E}
  .ecouter{margin-top:16px}
  .ecouter a{color:var(--manteau);font-weight:500}

  .nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}
  .bouton{
    border-radius:999px;padding:11px 22px;cursor:pointer;font-size:1.05rem;border:1px solid #CBD2E1;background:#fff;color:var(--encre);
  }
  .bouton.plein{background:var(--manteau);border-color:var(--manteau);color:#fff;font-weight:700;min-width:150px}
  .bouton:disabled{opacity:.4;cursor:default}
  .progres{color:var(--doux);font-size:.95rem;text-align:center}
  .astuce{color:var(--doux);font-size:.92rem;text-align:center;margin-top:10px}

  /* ---------- Les prières (référence) ---------- */
  .prieres{margin-top:44px}
  .prieres h2{font-family:var(--display);font-weight:400;font-size:1.7rem;color:var(--nuit);margin:0 0 10px}
  details{border-top:1px solid var(--trait)}
  details:last-of-type{border-bottom:1px solid var(--trait)}
  summary{cursor:pointer;padding:12px 2px;font-weight:500;font-size:1.05rem}
  details .priere{padding:0 2px 16px;font-size:1.1rem}

  footer{background:var(--nuit);color:#C6CEE0;text-align:center;padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px));font-size:.95rem}
  footer a{color:var(--cierge)}

  @media (max-width:640px){
    body{font-size:17px}
    .choix{grid-template-columns:repeat(2,1fr)}
    .bouton{padding:11px 16px}
    .bouton.plein{min-width:0}
    .grain{width:11px;height:11px}
    .grain.gros{width:17px;height:17px}
  }
</style>
</head>
<body>

<header class="haut">
  <div class="haut-int">
    <a class="marque" href="./">Aimez-Vous</a>
    <a class="retour" href="./">Retour aux chants</a>
  </div>
</header>

<div class="titre-page">
  <h1>Le Saint Rosaire</h1>
  <p>Prier avec Marie en contemplant la vie du Christ, une dizaine après l'autre.</p>
</div>

<main>
  <div class="choix" id="choix" role="group" aria-label="Choisir les mystères"></div>
  <p class="aujourdhui" id="aujourdhui"></p>

  <div class="chapelet" id="chapelet" aria-label="Le chapelet : touchez un grain pour y aller"></div>

  <article class="etape" id="etape" aria-live="polite"></article>

  <div class="nav">
    <button class="bouton" id="prec">Précédent</button>
    <span class="progres" id="progres"></span>
    <button class="bouton plein" id="suiv">Suivant</button>
  </div>
  <p class="astuce">Sur ordinateur, les flèches du clavier passent d'une prière à l'autre.</p>

  <section class="prieres" aria-labelledby="titre-prieres">
    <h2 id="titre-prieres">Les prières du Rosaire</h2>
    <div id="liste-prieres"></div>
  </section>
</main>

<footer><a href="./">Aimez-Vous</a> · Chants et psaumes à écouter, prier et partager</footer>

<script>
/* ================================================================
   Les prières
   ================================================================ */
const PRIERES = {
  signe: { nom:"Le signe de la croix",
    texte:"Au nom du Père, et du Fils, et du Saint-Esprit. Amen." },
  credo: { nom:"Je crois en Dieu",
    texte:"Je crois en Dieu, le Père tout-puissant, créateur du ciel et de la terre.\nEt en Jésus Christ, son Fils unique, notre Seigneur, qui a été conçu du Saint-Esprit, est né de la Vierge Marie, a souffert sous Ponce Pilate, a été crucifié, est mort et a été enseveli, est descendu aux enfers, le troisième jour est ressuscité des morts, est monté aux cieux, est assis à la droite de Dieu le Père tout-puissant, d'où il viendra juger les vivants et les morts.\nJe crois en l'Esprit Saint, à la sainte Église catholique, à la communion des saints, à la rémission des péchés, à la résurrection de la chair, à la vie éternelle. Amen." },
  pater: { nom:"Notre Père",
    texte:"Notre Père, qui es aux cieux,\nque ton nom soit sanctifié,\nque ton règne vienne,\nque ta volonté soit faite sur la terre comme au ciel.\nDonne-nous aujourd'hui notre pain de ce jour.\nPardonne-nous nos offenses,\ncomme nous pardonnons aussi à ceux qui nous ont offensés.\nEt ne nous laisse pas entrer en tentation,\nmais délivre-nous du Mal.\nAmen." },
  ave: { nom:"Je vous salue Marie",
    texte:"Je vous salue, Marie, pleine de grâce ;\nle Seigneur est avec vous.\nVous êtes bénie entre toutes les femmes,\net Jésus, le fruit de vos entrailles, est béni.\nSainte Marie, Mère de Dieu,\npriez pour nous, pauvres pécheurs,\nmaintenant et à l'heure de notre mort.\nAmen." },
  gloria: { nom:"Gloire au Père",
    texte:"Gloire au Père, et au Fils, et au Saint-Esprit,\ncomme il était au commencement,\nmaintenant et toujours,\net dans les siècles des siècles.\nAmen." },
  fatima: { nom:"Ô mon Jésus",
    texte:"Ô mon Jésus, pardonnez-nous nos péchés,\npréservez-nous du feu de l'enfer,\nconduisez au ciel toutes les âmes,\nsurtout celles qui ont le plus besoin de votre miséricorde." },
  salve: { nom:"Salut, ô Reine",
    texte:"Salut, ô Reine, Mère de miséricorde,\nnotre vie, notre douceur, notre espérance, salut !\nEnfants d'Ève, exilés, nous crions vers vous ;\nvers vous nous soupirons, gémissant et pleurant dans cette vallée de larmes.\nÔ vous, notre avocate, tournez vers nous vos regards miséricordieux.\nEt, après cet exil, montrez-nous Jésus, le fruit béni de vos entrailles.\nÔ clémente, ô miséricordieuse, ô douce Vierge Marie !\n\nPriez pour nous, sainte Mère de Dieu,\nafin que nous devenions dignes des promesses du Christ." }
};

/* ================================================================
   Les mystères
   ================================================================ */
const MYSTERES = {
  joyeux: { nom:"Joyeux", jours:"Lundi et samedi", liste:[
    { t:"L'Annonciation", v:"Voici la servante du Seigneur ; que tout m'advienne selon ta parole.", r:"Luc 1, 38", f:"l'humilité" },
    { t:"La Visitation", v:"Tu es bénie entre toutes les femmes, et le fruit de tes entrailles est béni.", r:"Luc 1, 42", f:"la charité envers le prochain" },
    { t:"La Nativité", v:"Elle mit au monde son fils premier-né ; elle l'emmaillota et le coucha dans une mangeoire.", r:"Luc 2, 7", f:"l'esprit de pauvreté" },
    { t:"La Présentation de Jésus au Temple", v:"Mes yeux ont vu le salut.", r:"Luc 2, 30", f:"l'obéissance" },
    { t:"Jésus retrouvé au Temple", v:"Ne saviez-vous pas qu'il me faut être chez mon Père ?", r:"Luc 2, 49", f:"la recherche de Dieu en toute chose" }
  ]},
  lumineux: { nom:"Lumineux", jours:"Jeudi", liste:[
    { t:"Le Baptême de Jésus au Jourdain", v:"Celui-ci est mon Fils bien-aimé, en qui je trouve ma joie.", r:"Matthieu 3, 17", f:"la fidélité à notre baptême" },
    { t:"Les Noces de Cana", v:"Tout ce qu'il vous dira, faites-le.", r:"Jean 2, 5", f:"la confiance en Marie" },
    { t:"L'Annonce du Royaume de Dieu", v:"Convertissez-vous et croyez à l'Évangile.", r:"Marc 1, 15", f:"la conversion du cœur" },
    { t:"La Transfiguration", v:"Celui-ci est mon Fils, celui que j'ai choisi : écoutez-le !", r:"Luc 9, 35", f:"le désir de sainteté" },
    { t:"L'Institution de l'Eucharistie", v:"Ceci est mon corps, donné pour vous. Faites cela en mémoire de moi.", r:"Luc 22, 19", f:"l'amour de l'Eucharistie" }
  ]},
  douloureux: { nom:"Douloureux", jours:"Mardi et vendredi", liste:[
    { t:"L'Agonie de Jésus à Gethsémani", v:"Père, que ce ne soit pas ma volonté, mais la tienne qui se fasse.", r:"Luc 22, 42", f:"l'abandon à la volonté de Dieu" },
    { t:"La Flagellation", v:"Alors Pilate fit saisir Jésus pour qu'il soit flagellé.", r:"Jean 19, 1", f:"la pureté" },
    { t:"Le Couronnement d'épines", v:"Ils tressèrent une couronne d'épines et la posèrent sur sa tête.", r:"Matthieu 27, 29", f:"le courage dans l'humiliation" },
    { t:"Le Portement de la Croix", v:"Jésus, portant lui-même sa croix, sortit en direction du lieu dit Le Crâne.", r:"Jean 19, 17", f:"la patience dans les épreuves" },
    { t:"La Crucifixion et la mort de Jésus", v:"Père, entre tes mains je remets mon esprit.", r:"Luc 23, 46", f:"le don de soi" }
  ]},
  glorieux: { nom:"Glorieux", jours:"Mercredi et dimanche", liste:[
    { t:"La Résurrection", v:"Il n'est pas ici, il est ressuscité.", r:"Luc 24, 6", f:"la foi" },
    { t:"L'Ascension", v:"Ce Jésus qui a été enlevé au ciel d'auprès de vous viendra de la même manière.", r:"Actes 1, 11", f:"l'espérance" },
    { t:"La Pentecôte", v:"Tous furent remplis d'Esprit Saint.", r:"Actes 2, 4", f:"la docilité à l'Esprit Saint" },
    { t:"L'Assomption de Marie", v:"Désormais tous les âges me diront bienheureuse.", r:"Luc 1, 48", f:"la grâce d'une bonne mort" },
    { t:"Le Couronnement de Marie", v:"Une Femme, ayant le soleil pour manteau, la lune sous les pieds, et sur la tête une couronne de douze étoiles.", r:"Apocalypse 12, 1", f:"la confiance en Marie, notre Mère" }
  ]}
};
const ORDRE = ["joyeux","lumineux","douloureux","glorieux"];
// dimanche = 0 … samedi = 6
const DU_JOUR = ["glorieux","joyeux","douloureux","glorieux","lumineux","douloureux","joyeux"];
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const ORDINAUX = ["Premier","Deuxième","Troisième","Quatrième","Cinquième"];

/* ================================================================
   Le chapelet : les grains, puis les étapes
   ================================================================ */
// Grains : croix, gros, 3 petits, médaille, puis 5 × (gros + 10 petits)
const GRAINS = [{type:"croix"},{type:"gros"},{type:"petit"},{type:"petit"},{type:"petit"},{type:"medaille"}];
const GROS_DIZAINE = [], PETITS_DIZAINE = [];
for(let d=0; d<5; d++){
  GROS_DIZAINE.push(GRAINS.length); GRAINS.push({type:"gros"});
  PETITS_DIZAINE.push([]);
  for(let a=0; a<10; a++){ PETITS_DIZAINE[d].push(GRAINS.length); GRAINS.push({type:"petit"}); }
}

function construireEtapes(){
  const e = [];
  e.push({ p:"signe", grain:0, ou:"Ouverture" });
  e.push({ p:"credo", grain:0, ou:"Sur la croix" });
  e.push({ p:"pater", grain:1, ou:"Sur le premier gros grain" });
  ["pour grandir dans la foi","pour grandir dans l'espérance","pour grandir dans la charité"].forEach((intention,i) =>
    e.push({ p:"ave", grain:2+i, ou:"Petit grain " + (i+1) + " sur 3, " + intention, compte:[i,3] }));
  e.push({ p:"gloria", grain:4, ou:"Avant la première dizaine" });
  for(let d=0; d<5; d++){
    e.push({ mystere:d, grain:GROS_DIZAINE[d] });
    e.push({ p:"pater", grain:GROS_DIZAINE[d], ou:"Sur le gros grain", d });
    for(let a=0; a<10; a++)
      e.push({ p:"ave", grain:PETITS_DIZAINE[d][a], ou:"Je vous salue Marie " + (a+1) + " sur 10", compte:[a,10], d });
    e.push({ p:"gloria", grain:PETITS_DIZAINE[d][9], ou:"Fin de la dizaine", d });
    e.push({ p:"fatima", grain:PETITS_DIZAINE[d][9], ou:"Fin de la dizaine", d });
  }
  e.push({ p:"salve", grain:5, ou:"Pour conclure", ecouter:true });
  e.push({ p:"signe", grain:5, ou:"Fin du Rosaire", fin:true });
  return e;
}
const ETAPES = construireEtapes();

/* ================================================================
   Affichage
   ================================================================ */
const $ = s => document.querySelector(s);
const echapper = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const memoire = {
  lire(){ try{ return JSON.parse(localStorage.getItem("rosaire") || "null"); }catch(e){ return null; } },
  ecrire(v){ try{ localStorage.setItem("rosaire", JSON.stringify(v)); }catch(e){} }
};

const aujourd = new Date().getDay();
let serie = DU_JOUR[aujourd];
let pas = 0;
const garde = memoire.lire();
if(garde && garde.date === new Date().toDateString() && MYSTERES[garde.serie]){
  serie = garde.serie; pas = Math.min(garde.pas || 0, ETAPES.length-1);
}

function construireChoix(){
  $("#choix").innerHTML = ORDRE.map(id =>
    `<button data-s="${id}" aria-pressed="${id===serie}"><strong>${MYSTERES[id].nom}</strong><span>${MYSTERES[id].jours}</span></button>`).join("");
  $("#choix").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    if(b.dataset.s === serie) return;
    serie = b.dataset.s;
    $("#choix").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x===b));
    afficher();
  }));
  $("#aujourdhui").textContent = "Ce " + JOURS[aujourd] + ", l'Église propose les mystères " + MYSTERES[DU_JOUR[aujourd]].nom.toLowerCase() + ".";
}

function construireChapelet(){
  let html = "";
  GRAINS.forEach((g,i) => {
    if(GROS_DIZAINE.includes(i) || i===5) html += `<span class="sep"></span>`;
    const label = g.type==="croix" ? "La croix" : g.type==="medaille" ? "La médaille" : g.type==="gros" ? "Gros grain" : "Petit grain";
    const contenu = g.type==="croix" ? "✝" : g.type==="medaille" ? "✦" : "";
    html += `<button class="grain ${g.type==="petit"?"":g.type}" data-g="${i}" aria-label="${label}">${contenu}</button>`;
  });
  $("#chapelet").innerHTML = html;
  $("#chapelet").querySelectorAll(".grain").forEach(b => b.addEventListener("click", () => {
    const g = +b.dataset.g;
    const i = ETAPES.findIndex(e => e.grain === g);
    if(i >= 0){ pas = i; afficher(); }
  }));
}

function afficher(){
  const e = ETAPES[pas];
  const serieM = MYSTERES[serie];
  let html;

  if(e.mystere !== undefined){
    const m = serieM.liste[e.mystere];
    html = `<p class="ou">${ORDINAUX[e.mystere]} mystère ${serieM.nom.toLowerCase()}</p>
      <h2>${echapper(m.t)}</h2>
      <blockquote class="verset">« ${echapper(m.v)} »<cite>${echapper(m.r)}</cite></blockquote>
      <p class="fruit">Demandons <strong>${echapper(m.f)}</strong>.</p>`;
  } else {
    const p = PRIERES[e.p];
    let ou = e.ou;
    if(e.d !== undefined) ou = (e.d+1) + (e.d===0?"er":"e") + " mystère, " + serieM.liste[e.d].t.charAt(0).toLowerCase() + serieM.liste[e.d].t.slice(1) + " : " + ou.charAt(0).toLowerCase() + ou.slice(1);
    let compte = "";
    if(e.compte){
      const [n,total] = e.compte;
      compte = `<div class="compte" aria-hidden="true">${Array.from({length:total},(_,k)=>`<i class="${k<n?"fait":k===n?"ici":""}"></i>`).join("")}</div>`;
    }
    html = `<p class="ou">${echapper(ou)}</p><h2>${echapper(p.nom)}</h2>${compte}<div class="priere">${echapper(p.texte)}</div>`;
    if(e.ecouter) html += `<p class="ecouter">Pour prolonger la prière : <a href="chant.html?c=le-magnificat">écouter le Magnificat</a>.</p>`;
    if(e.fin) html += `<p class="ecouter">Merci d'avoir prié avec nous. <a href="./">Retour aux chants</a></p>`;
  }
  $("#etape").innerHTML = html;

  // chapelet
  const ici = e.grain;
  $("#chapelet").querySelectorAll(".grain").forEach(b => {
    const g = +b.dataset.g;
    b.classList.toggle("ici", g === ici);
    const fait = ETAPES.slice(0, pas).some(x => x.grain === g) && g !== ici;
    b.classList.toggle("fait", fait);
  });

  $("#prec").disabled = pas === 0;
  $("#suiv").textContent = pas === ETAPES.length-1 ? "Recommencer" : "Suivant";
  $("#progres").textContent = "Étape " + (pas+1) + " sur " + ETAPES.length;
  memoire.ecrire({ date:new Date().toDateString(), serie, pas });
}

function suivant(){ pas = pas === ETAPES.length-1 ? 0 : pas+1; afficher(); }
function precedent(){ if(pas>0){ pas--; afficher(); } }
$("#suiv").addEventListener("click", suivant);
$("#prec").addEventListener("click", precedent);
document.addEventListener("keydown", e => {
  if(e.target.closest("summary")) return;
  if(e.key === "ArrowRight"){ suivant(); }
  if(e.key === "ArrowLeft"){ precedent(); }
});

$("#liste-prieres").innerHTML = ["signe","credo","pater","ave","gloria","fatima","salve"].map(k =>
  `<details><summary>${echapper(PRIERES[k].nom)}</summary><div class="priere">${echapper(PRIERES[k].texte)}</div></details>`).join("");

construireChoix();
construireChapelet();
afficher();
</script>
