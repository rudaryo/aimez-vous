<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aimez-Vous | Chants de louange et Saint Rosaire</title>
<meta name="description" content="Aimez-vous les uns les autres. Psaumes, chants catholiques de louange et d'adoration, et le Saint Rosaire à prier, écouter et partager.">
<meta property="og:title" content="Aimez-Vous | Chants de louange et Saint Rosaire">
<meta property="og:description" content="Psaumes, chants de louange et Saint Rosaire à écouter et partager.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aimez-vous.org/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕊️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --nuit:#14223F;      /* bleu de la nuit à Lourdes */
    --manteau:#2C4A86;   /* bleu marial */
    --cierge:#E9B949;    /* flamme des cierges */
    --rocher:#E8E4DC;    /* pierre de la grotte */
    --page:#F7F8FB;
    --encre:#1B2232;
    --doux:#5A6378;
    --display:"Marcellus", Georgia, "Times New Roman", serif;
    --texte:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--page);color:var(--encre);font-family:var(--texte);font-size:18px;line-height:1.5}
  img{max-width:100%;display:block}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--cierge);outline-offset:3px;border-radius:4px}

  /* ---------- En-tête ---------- */
  .hero{
    background:var(--nuit);color:#fff;text-align:center;
    padding:calc(56px + env(safe-area-inset-top,0px)) 20px 64px;
    position:relative;overflow:hidden;
  }
  .hero::before{ /* procession aux flambeaux : petites lueurs */
    content:"";position:absolute;left:0;right:0;bottom:0;height:70px;
    background:
      radial-gradient(circle at 6% 70%,var(--cierge) 0 2px,transparent 3px),
      radial-gradient(circle at 15% 55%,var(--cierge) 0 2px,transparent 3px),
      radial-gradient(circle at 24% 75%,var(--cierge) 0 2px,transparent 3px),
      radial-gradient(circle at 33% 60%,var(--cierge) 0 2px,transparent 3px),
      radial-gradient(circle at 42% 72%,var(--cierge) 0 2px,transparent 3px),
      radial-gradient(circle at 51% 58%,var(--cierge) 0 2px,transparent 3px),
      radial-gradient(circle at 60% 74%,var(--cierge) 0 2px,transparent 3px),
      radial-gradient(circle at 69% 56%,var(--cierge) 0 2px,transparent 3px),
      radial-gradient(circle at 78% 70%,var(--cierge) 0 2px,transparent 3px),
      radial-gradient(circle at 87% 60%,var(--cierge) 0 2px,transparent 3px),
      radial-gradient(circle at 95% 73%,var(--cierge) 0 2px,transparent 3px);
    opacity:.8;
  }
  .salut{font-size:1rem;color:var(--cierge);margin:0 0 10px;letter-spacing:.02em}
  .hero h1{
    font-family:var(--display);font-weight:400;margin:0;
    font-size:clamp(3rem,11vw,6.5rem);line-height:1;letter-spacing:.01em;
  }
  .verset{font-family:var(--display);font-size:clamp(1.05rem,2.6vw,1.35rem);max-width:34ch;margin:22px auto 0;color:#DDE3F0;line-height:1.45}
  .verset cite{display:block;font-style:normal;font-family:var(--texte);font-size:.9rem;color:#A9B4CC;margin-top:8px}

  /* ---------- Rosaire ---------- */
  .rosaire{
    max-width:1100px;margin:-28px auto 0;padding:0 20px;position:relative;
  }
  .rosaire a{
    display:flex;align-items:center;gap:18px;text-decoration:none;
    background:#fff;border:1px solid #DCE1EC;border-left:6px solid var(--manteau);
    border-radius:10px;padding:18px 22px;box-shadow:0 8px 24px rgba(20,34,63,.12);
  }
  .rosaire .icone{font-size:2rem;line-height:1}
  .rosaire strong{font-family:var(--display);font-weight:400;font-size:1.4rem;display:block;color:var(--nuit)}
  .rosaire span{color:var(--doux);font-size:1rem}
  .rosaire a:hover strong{color:var(--manteau);text-decoration:underline}

  /* ---------- Navigation ---------- */
  .barre{
    position:sticky;top:0;z-index:5;background:rgba(247,248,251,.96);
    backdrop-filter:blur(6px);border-bottom:1px solid #E1E5EE;margin-top:36px;
    padding-top:env(safe-area-inset-top,0px);
  }
  .barre-int{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .onglets{display:flex;gap:8px;overflow-x:auto;flex:1 1 auto;scrollbar-width:none}
  .onglets::-webkit-scrollbar{display:none}
  .onglet{
    flex:none;font:inherit;font-size:.98rem;border:1px solid #CBD2E1;background:#fff;color:var(--encre);
    padding:7px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;
  }
  .onglet[aria-pressed="true"]{background:var(--manteau);border-color:var(--manteau);color:#fff}
  .recherche{flex:0 1 240px;min-width:180px}
  .recherche input{
    width:100%;font:inherit;font-size:.98rem;padding:8px 14px;border-radius:999px;
    border:1px solid #CBD2E1;background:#fff;color:var(--encre);
  }

  /* ---------- Sections et cartes ---------- */
  main{max-width:1100px;margin:0 auto;padding:12px 20px 40px}
  section{padding-top:34px;scroll-margin-top:80px}
  section h2{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,4vw,2.1rem);margin:0;color:var(--nuit)}
  section .intro{margin:4px 0 18px;color:var(--doux);max-width:60ch}
  .grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
  .carte{display:flex;flex-direction:column;border-radius:8px;text-decoration:none;color:inherit}
  .carte:hover .titre{text-decoration:underline}
  .vignette{
    position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--nuit);
  }
  /* photos de toutes formes : l'image entière, sur un fond flou d'elle-même */
  .vignette .flou{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(16px) brightness(.55);transform:scale(1.15)}
  .vignette .net{position:relative;width:100%;height:100%;object-fit:contain}
  .sans-image{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:14px;color:#fff;font-family:var(--display);font-size:1.1rem;line-height:1.25;
    background:linear-gradient(160deg,var(--manteau),var(--nuit));
  }
  .lecture{
    position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;
    background:rgba(20,34,63,.85);display:flex;align-items:center;justify-content:center;
  }
  .lecture svg{width:16px;height:16px;fill:var(--cierge);margin-left:3px}
  .carte:hover .lecture,.carte:focus-visible .lecture{background:var(--cierge)}
  .carte:hover .lecture svg,.carte:focus-visible .lecture svg{fill:var(--nuit)}
  .titre{margin-top:10px;font-weight:500;line-height:1.3}
  .ref{font-size:.9rem;color:var(--doux)}
  .vide{color:var(--doux);padding:30px 0}

  footer{
    background:var(--nuit);color:#C6CEE0;text-align:center;
    padding:36px 20px calc(36px + env(safe-area-inset-bottom,0px));font-size:.98rem;
  }
  footer a{color:var(--cierge)}
  footer p{margin:6px 0}

  @media (max-width:600px){
    body{font-size:17px}
    .grille{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
    .recherche{flex:1 1 100%}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="hero">
  <p class="salut">Shlama ‘immakh, la paix soit avec vous</p>
  <h1>Aimez-Vous</h1>
  <p class="verset">« Aimez-vous les uns les autres comme je vous ai aimés. »
    <cite>Jean 13, 34</cite></p>
</header>

<div class="rosaire">
  <a href="rosaire.html">
    <span class="icone" aria-hidden="true">📿</span>
    <span><strong>Prier le Saint Rosaire</strong>
    <span>Les mystères et les prières, à suivre pas à pas</span></span>
  </a>
</div>

<nav class="barre" aria-label="Catégories de chants">
  <div class="barre-int">
    <div class="onglets" id="onglets"></div>
    <label class="recherche">
      <input type="search" id="recherche" placeholder="Chercher un chant…" aria-label="Chercher un chant">
    </label>
  </div>
</nav>

<main id="chants"></main>

<footer>
  <p>Chants et psaumes à écouter, prier et partager.</p>
  <p><a id="chaine" href="#" target="_blank" rel="noopener">Retrouvez tous les chants sur YouTube</a></p>
  <p>© <span id="annee"></span> Aimez-Vous</p>
</footer>

<script src="chants.js"></script>
<script>
/* Page d'accueil : la liste des chants se trouve dans chants.js */
const $ = s => document.querySelector(s);
let filtre = "tout";

function construireOnglets(){
  const liste = [{id:"tout",nom:"Tous les chants"}, ...CATEGORIES];
  $("#onglets").innerHTML = liste.map(c =>
    `<button class="onglet" data-cat="${c.id}" aria-pressed="${c.id===filtre}">${echapper(c.nom)}</button>`).join("");
  $("#onglets").querySelectorAll(".onglet").forEach(b => b.addEventListener("click", () => {
    filtre = b.dataset.cat;
    $("#onglets").querySelectorAll(".onglet").forEach(x => x.setAttribute("aria-pressed", x===b));
    afficher();
  }));
}

function carte(ch){
  const src = imageDe(ch);
  const image = src
    ? `<img class="flou" src="${echapper(src)}" alt="" loading="lazy" aria-hidden="true" onerror="this.remove()">
       <img class="net" src="${echapper(src)}" alt="" loading="lazy" data-t="${echapper(ch.titre)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'sans-image',textContent:this.dataset.t}))">`
    : `<div class="sans-image">${echapper(ch.titre)}</div>`;
  return `<a class="carte" href="chant.html?c=${ch.slug}">
      <div class="vignette">${image}
        <span class="lecture" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z"/></svg></span>
      </div>
      <span class="titre">${echapper(ch.titre)}</span>
      ${ch.ref ? `<span class="ref">${echapper(ch.ref)}</span>` : ""}
    </a>`;
}

function afficher(){
  const q = sansAccents($("#recherche").value.trim());
  const cats = filtre==="tout" ? CATEGORIES : CATEGORIES.filter(c => c.id===filtre);
  let html = "";
  cats.forEach(c => {
    const chants = CHANTS.filter(ch => ch.cat===c.id &&
      (!q || sansAccents(ch.titre + " " + (ch.ref||"")).includes(q)));
    if(!chants.length) return;
    html += `<section id="${c.id}">
      <h2>${echapper(c.nom)}</h2><p class="intro">${echapper(c.intro)}</p>
      <div class="grille">${chants.map(carte).join("")}</div></section>`;
  });
  $("#chants").innerHTML = html || `<p class="vide">Aucun chant ne correspond à « ${echapper($("#recherche").value)} ». Essayez un autre mot.</p>`;
}

$("#recherche").addEventListener("input", afficher);
$("#chaine").href = CHAINE_YOUTUBE;
$("#annee").textContent = new Date().getFullYear();
construireOnglets();
afficher();
</script>
</body>
</html>
